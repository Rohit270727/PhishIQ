{% extends "base.html" %}
{% block title %}Login - PhishIQ{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1>PhishIQ</h1>
            <p>Detect phishing before it detects you.</p>
        </div>
        <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>
        <p class="auth-switch"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
        <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    </div>
</div>
{% endblock %}
